name: Life Skills source integrity
on:
  schedule:
    - cron: '17 4 * * *'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Main audit, or independently reviewed exact-head bootstrap
        type: choice
        options: [audit, bootstrap]
        default: audit
        required: true
      pr_number:
        description: SYS-034 PR number for protected bootstrap
        type: string
        required: false
      reviewed_head_sha:
        description: Exact externally pinned 40-character bootstrap commit
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: source-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  trusted-source-reader:
    if: github.event_name == 'pull_request_target' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: source-integrity-reader
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Trusted checker regression tests without Google credentials
        run: python3 -m unittest discover -s tools/source-audit/tests -v
      - name: Trusted-base PR check; proposed files are data only
        if: github.event_name == 'pull_request_target'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SOURCE_READER_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/source-audit/policy_gate.py --pr "$PR_NUMBER" --publish-status --output "$RUNNER_TEMP/source-audit-report.json"
      - name: Strict global main or natural-schedule audit
        if: github.event_name != 'pull_request_target'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SOURCE_READER_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/source-audit/audit.py --live --output "$RUNNER_TEMP/source-audit-report.json"
  bootstrap-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bind dispatch to the independently reviewed commit
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[a-f0-9]{40}',os.environ['REVIEWED_HEAD']), 'INVALID_HEAD'
          assert os.environ['REVIEWED_HEAD'] == os.environ['GITHUB_SHA'], 'HEAD_MISMATCH'
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['PR_NUMBER']), 'INVALID_PR'
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepared checker tests; no service credentials
        run: python3 -m unittest discover -s tools/source-audit/tests -v
  reviewed-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap'
    needs: bootstrap-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: source-policy-bootstrap
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Approved exact-head bootstrap only; never a merge or deployment
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SOURCE_READER_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 tools/source-audit/policy_gate.py --pr "$PR_NUMBER" --bootstrap-head "$REVIEWED_HEAD" --publish-status --output "$RUNNER_TEMP/source-audit-bootstrap.json"
