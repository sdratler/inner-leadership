name: Source integrity
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  statuses: write
concurrency:
  group: source-integrity-${{ github.event.pull_request.number || 'daily' }}
  cancel-in-progress: false
jobs:
  source-integrity:
    # Never execute pull-request code with Google credentials. Dispatch only main.
    if: >-
      github.repository == 'sdratler/inner-leadership' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sdratler/inner-leadership
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test trusted checker
        run: python3 -m unittest discover -s tools/source-audit/tests -v
      - name: Read current canonical sources
        id: audit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LIFE_SKILLS_AUDIT_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/source-audit/audit.py --live
          --output "$RUNNER_TEMP/source-integrity-report.json"
      - name: Bind result to proposed commit
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha=os.environ['TARGET_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}',sha): raise SystemExit('Invalid target SHA')
          ok=os.environ.get('AUDIT_OUTCOME')=='success'
          body=json.dumps({'state':'success' if ok else 'failure',
            'context':'source-integrity',
            'description':'Fresh canonical-source gate passed' if ok else 'Source gate blocked or unavailable',
            'target_url':f"https://github.com/sdratler/inner-leadership/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/sdratler/inner-leadership/statuses/{sha}',
            data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'LifeSkillsSourceAudit'})
          with urllib.request.urlopen(req,timeout=20) as response:
            if response.status not in (200,201): raise SystemExit('Status write failed')
          print('Source-integrity status recorded for proposed commit.')
          PY
